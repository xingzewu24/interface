policy_inputs:
- name: current_action
  key: current_action
  shape: [1, 29]
  kind: last_actions
  provider: policy_history
  source_namespace: current_action
  dtype: float32
  output_key: actions
  history: 1
  first_action_lag: 1
  steps_back: [1]
  fill_before_available: zeros
  source: The applied command in the graph's actions coordinate system. Feed back
    any deploy-side edit, not the rejected network prediction. Slot i holds the values
    from steps_back[i] policy calls ago; until that many calls have run since a reset,
    it holds fill_before_available.
  reset_value: 0.0
- name: masked_mimic_anchor_rotation_mask
