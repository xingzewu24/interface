- name: scene_boxes_extents
  key: scene_boxes.extents
  shape: [1, 1, 2, 3]
  kind: scene_box_extents
  provider: scene
  source_namespace: scene_boxes
  dtype: float32
  element_names:
  - [x, y, z]
  source: Full box side lengths in metres in each object's own frame, [object, box,
    xyz], asset scale included; any value for a padding box.
- name: scene_boxes_object_pos
  key: scene_boxes.object_pos
  shape: [1, 1, 3]
  kind: scene_object_pos
  provider: scene
  source_namespace: scene_boxes
  dtype: float32
  element_names:
  - [x, y, z]
  source: Object origin in metres in the host localization frame, [object, xyz]; the
    same frame as the robot's anchor position.
- name: scene_boxes_object_rot
  key: scene_boxes.object_rot
  shape: [1, 1, 4]
  kind: scene_object_rot
  provider: scene
  source_namespace: scene_boxes
  dtype: float32
  element_names:
  - [x, y, z, w]
  source: Object orientation as an xyzw unit quaternion in the host localization frame,
    [object, xyzw].
- name: scene_boxes_position_offset
  key: scene_boxes.position_offset
  shape: [1, 3]
  kind: scene_position_offset
  provider: scene
  source_namespace: scene_boxes
  dtype: float32
  element_names:
  - [x, y, z]
  source: Bias added to every observed object position, metres, xyz; a training perturbation
    of the observed pose. Feed zeros.
- name: scene_boxes_valid
  key: scene_boxes.valid
  shape: [1, 1, 2]
  kind: scene_box_valid
  provider: scene
  source_namespace: scene_boxes
  dtype: bool
  source: 'Boolean [object, box]: the box exists; false for padding slots, whose geometry
    and pose are ignored.'
- name: scene_boxes_visible
  key: scene_boxes.visible
  shape: [1, 1, 1]
  kind: scene_object_visible
  provider: scene
  source_namespace: scene_boxes
  dtype: bool
  source: 'Boolean [object, 1]: the object is shown to the policy; false hides every
    box of the object.'
- name: scene_boxes_yaw_offset
  key: scene_boxes.yaw_offset
  shape: [1]
  kind: scene_yaw_offset
  provider: scene
  source_namespace: scene_boxes
  dtype: float32
  source: Yaw bias in radians composed onto every observed object orientation; a training
    perturbation of the observed pose. Feed zero.
policy_outputs:
