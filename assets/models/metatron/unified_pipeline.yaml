- name: scene_boxes_centers
  key: scene_boxes.centers
  shape: [1, 1, 2, 3]
  kind: scene_box_centers
  provider: scene
  source_namespace: scene_boxes
  dtype: float32
  element_names:
  - [x, y, z]
  source: Box centres in metres in each object's own frame, [object, box, xyz], asset
